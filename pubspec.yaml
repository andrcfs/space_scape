name: space_scape
description: "A new Flame project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flame: ^1.18.0
  audioplayers: ^5.2.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

platforms:
  windows:

flutter:
  assets:
    - assets/audio/
    - assets/images/
    - assets/tiles/
  fonts:
    - family: Unlearned
      fonts:
        - asset: assets/fonts/unlearned2.ttf
  uses-material-design: true
